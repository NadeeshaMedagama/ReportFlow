name: Release

# Cuts a release from a version tag: verifies the tree, generates release notes
# from the commit history, attaches build artifacts, then hands off to the
# publishing workflows (Docker Hub, GitHub Packages, Marketplace).
#
# Usage:
#   git tag v1.0.0 && git push origin v1.0.0
# or run this workflow manually with a version to have it create the tag.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example v1.0.0"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  verify:
    name: Verify the release commit
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weekly_reports_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/weekly_reports_test?schema=public
      JWT_SECRET: release-verification-secret
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Resolve the version
        id: version
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semver tag such as v1.2.3."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run db:generate

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Migrate, seed and run end-to-end tests
        run: |
          npm run db:deploy
          npm run db:seed
          npm run test:e2e

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || 'http://localhost:4000' }}
          # Produces .next/standalone, which is what the release artifact ships.
          NEXT_OUTPUT_STANDALONE: "1"

      - name: Package build artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release
          # API: compiled output plus the Prisma schema and migrations.
          tar -czf "release/reportflow-api-${VERSION}.tar.gz" \
            -C apps/api dist package.json prisma
          # Web: the self-contained Next.js server plus its static assets.
          tar -czf "release/reportflow-web-${VERSION}.tar.gz" \
            -C apps/web/.next standalone static
          ls -lh release

      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release/
          retention-days: 14

  # --------------------------------------------------------------------------
  publish:
    name: Create the GitHub release
    runs-on: ubuntu-latest
    needs: [verify]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: release

      - name: Create the tag when run manually
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.verify.outputs.version }}" -m "Release ${{ needs.verify.outputs.version }}"
          git push origin "${{ needs.verify.outputs.version }}"

      - name: Build the changelog
        id: changelog
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          PREVIOUS=$(git tag --sort=-v:refname | grep -v "^${VERSION}$" | head -n1)
          RANGE=${PREVIOUS:+${PREVIOUS}..}HEAD
          echo "Comparing ${PREVIOUS:-the beginning of history} to $VERSION"
          {
            echo "## What's changed"
            echo
            git log --no-merges --pretty=format:'- %s (%h)' "$RANGE" | head -n 100
            echo
            echo
            if [ -n "$PREVIOUS" ]; then
              echo "**Full changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${PREVIOUS}...${VERSION}"
            fi
          } > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.version }}
          name: ReportFlow ${{ needs.verify.outputs.version }}
          body_path: CHANGELOG_RELEASE.md
          prerelease: ${{ inputs.prerelease || contains(needs.verify.outputs.version, '-') }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: false
