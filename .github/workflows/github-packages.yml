name: Publish to GitHub Packages

# Publishes to two GitHub Packages registries:
#   * ghcr.io  - the API and web container images
#   * npm.pkg.github.com - the @weekly-report/shared types package, so other
#     repositories in the organisation can depend on the API contract.
#
# Uses the built-in GITHUB_TOKEN; no extra secrets are required.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: github-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------- containers
  containers:
    name: Publish ${{ matrix.app }} image to ghcr.io
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        app: [api, web]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=ReportFlow ${{ matrix.app }}
            org.opencontainers.image.description=Weekly Report Generator and Team Dashboard - ${{ matrix.app }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:4000' }}
          cache-from: type=gha,scope=ghcr-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.app }}
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # -------------------------------------------------------------- npm package
  shared-types:
    name: Publish @weekly-report/shared to GitHub Packages
    runs-on: ubuntu-latest
    # Only publish the types package for tagged releases.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@weekly-report"

      - name: Set the package version from the git tag
        working-directory: packages/shared
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Make the package publishable
        working-directory: packages/shared
        run: |
          # The workspace copy is private; the published copy must not be.
          npm pkg delete private
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          npm pkg set repository.type=git
          npm pkg set repository.url="git+${{ github.server_url }}/${{ github.repository }}.git"

      - name: Publish
        working-directory: packages/shared
        run: npm publish --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
