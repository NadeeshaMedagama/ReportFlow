name: Publish to GitHub Marketplace

# Validates the action defined in the root action.yml, runs it end to end
# against a throwaway ReportFlow instance, then moves the floating major-version
# tag (v1) that Marketplace consumers pin to.
#
# Publishing itself is a one-time manual step: draft a release in the GitHub UI
# and tick "Publish this Action to the GitHub Marketplace". After that, every
# release verified here updates the major tag automatically.
on:
  push:
    branches: [main]
    paths:
      - action.yml
      - .github/action-scripts/**
      - .github/workflows/publish-marketplace.yml
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-marketplace-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  validate:
    name: Validate action metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check the action script parses
        run: node --check .github/action-scripts/compliance-check.mjs

      - name: Check action.yml against the Marketplace requirements
        run: |
          node -e "
          const fs = require('node:fs');
          const text = fs.readFileSync('action.yml', 'utf8');
          const need = (pattern, label) => {
            if (!pattern.test(text)) { console.log('::error::action.yml is missing ' + label); process.exit(1); }
          };
          need(/^name:\s*\S/m, 'a name');
          need(/^description:\s*\S/m, 'a description');
          need(/^branding:/m, 'a branding block (required by the Marketplace)');
          need(/icon:\s*\S/, 'a branding icon');
          need(/color:\s*(white|yellow|blue|green|orange|red|purple|gray-dark)\b/, 'a valid branding colour');
          need(/^runs:/m, 'a runs block');
          console.log('action.yml has everything the Marketplace requires.');
          "

      - name: Confirm the entrypoint referenced by action.yml exists
        run: test -f .github/action-scripts/compliance-check.mjs

  # --------------------------------------------------------------------------
  test-action:
    name: Run the action against a live instance
    runs-on: ubuntu-latest
    needs: [validate]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weekly_reports
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/weekly_reports?schema=public
      JWT_SECRET: marketplace-action-test-secret
      PORT: 4000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Prepare the database
        run: |
          npm run db:deploy
          npm run db:seed

      - name: Start the API
        run: |
          npm run build -w apps/api
          node apps/api/dist/main.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/health >/dev/null && echo "API is up" && exit 0
            sleep 2
          done
          echo "::error::API did not start"; exit 1

      - name: Run the action (seeded data is intentionally incomplete)
        id: compliance
        uses: ./
        continue-on-error: true
        with:
          api-url: http://localhost:4000
          email: manager@reportflow.dev
          password: Password123!
          minimum-compliance: "0"
          fail-on-missing: "false"

      - name: Check the action produced outputs
        run: |
          echo "Compliance:      ${{ steps.compliance.outputs.compliance-rate }}%"
          echo "Submitted:       ${{ steps.compliance.outputs.submitted }}"
          echo "Awaiting review: ${{ steps.compliance.outputs.awaiting-review }}"
          echo "Week:            ${{ steps.compliance.outputs.week-label }}"
          if [ -z "${{ steps.compliance.outputs.week-label }}" ]; then
            echo "::error::The action did not set its outputs."
            exit 1
          fi

      - name: Check the failure threshold is enforced
        id: threshold
        uses: ./
        continue-on-error: true
        with:
          api-url: http://localhost:4000
          email: manager@reportflow.dev
          password: Password123!
          # The seeded week is deliberately incomplete, so this must fail.
          minimum-compliance: "100"

      - name: Confirm the threshold step failed as expected
        run: |
          if [ "${{ steps.threshold.outcome }}" != "failure" ]; then
            echo "::error::The action should fail when compliance is below the minimum."
            exit 1
          fi
          echo "Threshold enforcement works."

      - name: Check bad credentials are rejected
        id: badcreds
        uses: ./
        continue-on-error: true
        with:
          api-url: http://localhost:4000
          email: manager@reportflow.dev
          password: WrongPassword123!

      - name: Confirm bad credentials failed
        run: |
          if [ "${{ steps.badcreds.outcome }}" != "failure" ]; then
            echo "::error::The action should fail when sign-in is rejected."
            exit 1
          fi
          echo "Credential handling works."

  # --------------------------------------------------------------------------
  tag-major-version:
    name: Move the major version tag
    runs-on: ubuntu-latest
    needs: [test-action]
    if: github.event_name == 'release' && !github.event.release.prerelease

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Point v<major> at this release
        run: |
          TAG="${{ github.event.release.tag_name }}"
          MAJOR="${TAG%%.*}"        # v1.2.3 -> v1
          echo "Moving $MAJOR to $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$TAG"
          git push origin "$MAJOR" --force
          {
            echo "### Marketplace action updated"
            echo
            echo "\`$MAJOR\` now points at \`$TAG\`. Consumers pinned to \`$MAJOR\` get this release."
            echo
            echo '```yaml'
            echo "- uses: ${{ github.repository }}@$MAJOR"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remind about the one-time publish step
        run: |
          echo "::notice::If this action is not on the Marketplace yet, edit the release in the GitHub UI and tick 'Publish this Action to the GitHub Marketplace'."
