name: Publish images to Docker Hub

# Builds multi-architecture images for the API and web app and pushes them to
# Docker Hub. Runs on every push to main (tagged `edge`), on version tags
# (semver tags plus `latest`), and on demand.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  Docker Hub account or organisation
#   DOCKERHUB_TOKEN     Docker Hub access token with Read/Write scope
# Optional repository variable:
#   DOCKERHUB_NAMESPACE  Defaults to DOCKERHUB_USERNAME
#   PUBLIC_API_URL       Baked into the web image (defaults to http://localhost:4000)
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (for example v1.2.3 or preview)"
        required: false
        type: string

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and push ${{ matrix.app }}
    runs-on: ubuntu-latest
    # Skip on forks, which have no Docker Hub credentials.
    if: github.repository_owner != '' && github.event.repository.fork == false

    strategy:
      fail-fast: false
      matrix:
        app: [api, web]

    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker Hub credentials are configured
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/reportflow-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=ReportFlow ${{ matrix.app }}
            org.opencontainers.image.description=Weekly Report Generator and Team Dashboard - ${{ matrix.app }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:4000' }}
          cache-from: type=gha,scope=dockerhub-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=dockerhub-${{ matrix.app }}
          provenance: mode=max
          sbom: true

      - name: Update Docker Hub description
        if: matrix.app == 'api' && startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/reportflow-api
          readme-filepath: ./README.md

      - name: Summary
        run: |
          {
            echo "### Published \`${{ matrix.app }}\` image"
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
