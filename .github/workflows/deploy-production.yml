name: Deploy production

# Promotes a released build to production: applies database migrations, then
# rolls out the API and web images. The `production` environment gates the run,
# so required reviewers and wait timers configured on that environment apply.
#
# Required secrets on the `production` environment:
#   PRODUCTION_DATABASE_URL   PostgreSQL connection string for migrations
#   DEPLOY_WEBHOOK_URL        Render/Railway/Fly deploy hook (optional)
#   DEPLOY_WEBHOOK_URL_WEB    Deploy hook for the web app (optional)
# Optional environment variables:
#   PRODUCTION_API_URL        Used for the post-deploy health check
#   PRODUCTION_WEB_URL        Used for the post-deploy smoke check
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or SHA to deploy. Leave this box empty to deploy the branch selected above."
        required: false
        default: ""
        type: string
      skip_migrations:
        description: "Skip database migrations"
        required: false
        default: false
        type: boolean

concurrency:
  # Never run two production deploys at once, and never cancel one midway.
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Turn whatever was requested into one concrete commit SHA before any
  # deploying happens. This runs outside the `production` environment so a bad
  # ref fails immediately with a readable message instead of after the approval
  # gate, and pinning the SHA keeps every job below on the same commit even if
  # the branch moves mid-run.
  resolve:
    name: Resolve deploy ref
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      display: ${{ steps.resolve.outputs.display }}

    steps:
      - name: Resolve and validate the requested ref
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED: ${{ inputs.ref }}
          FALLBACK: ${{ github.ref }}
        run: |
          set -euo pipefail

          # A published release always deploys its own tag. Otherwise use what
          # the operator typed, and fall back to the branch the run started from.
          requested=$(printf '%s' "${REQUESTED:-}" | tr -d '[:space:]')
          if [ -n "${RELEASE_TAG:-}" ]; then
            wanted="$RELEASE_TAG"; source="release tag"
          elif [ -n "$requested" ]; then
            wanted="$requested"; source="workflow_dispatch input"
          else
            wanted="$FALLBACK"; source="branch this run was started from"
          fi

          # Accept refs/heads/x and refs/tags/x as well as bare names.
          lookup="${wanted#refs/heads/}"
          lookup="${lookup#refs/tags/}"

          echo "Resolving '$wanted' ($source)"

          if ! sha=$(gh api "repos/$REPO/commits/$lookup" --jq .sha 2>/dev/null); then
            echo "::error title=Unknown deploy ref::'$wanted' is not a branch, tag or commit in $REPO, so there is nothing to check out."
            {
              echo "### Deploy aborted: unknown ref \`$wanted\`"
              echo
              echo "Nothing named \`$wanted\` exists in \`$REPO\`."
              echo "Leave the **Ref** box empty to deploy the branch you picked in *Use workflow from*,"
              echo "or enter one of these:"
              echo
              echo "**Recent tags**"
              gh api "repos/$REPO/tags?per_page=10" --jq '.[].name' 2>/dev/null | sed 's/^/- /' || echo "- (none)"
              echo
              echo "**Branches**"
              gh api "repos/$REPO/branches?per_page=20" --jq '.[].name' 2>/dev/null | sed 's/^/- /' || echo "- (none)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "display=$lookup" >> "$GITHUB_OUTPUT"
          echo "Deploying $wanted -> $sha"

  # --------------------------------------------------------------------------
  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    needs: [resolve]
    environment:
      name: production
      url: ${{ vars.PRODUCTION_WEB_URL }}
    if: ${{ !inputs.skip_migrations }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Show pending migrations
        run: npx prisma migrate status --schema apps/api/prisma/schema.prisma || true
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Apply migrations
        run: npm run db:deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

  # --------------------------------------------------------------------------
  deploy:
    name: Roll out ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [resolve, migrate]
    # Run even when migrations were skipped, but not if they failed - and never
    # when the ref could not be resolved, which always() would otherwise allow.
    if: >-
      always()
      && needs.resolve.result == 'success'
      && needs.migrate.result != 'failure'
      && needs.migrate.result != 'cancelled'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_WEB_URL }}

    strategy:
      max-parallel: 1
      matrix:
        # API first: the web app talks to it.
        app: [api, web]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Trigger the deploy hook
        env:
          HOOK: ${{ matrix.app == 'web' && secrets.DEPLOY_WEBHOOK_URL_WEB || secrets.DEPLOY_WEBHOOK_URL }}
          IMAGE_TAG: ${{ needs.resolve.outputs.display }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::No deploy hook configured for ${{ matrix.app }}; skipping the rollout step."
            echo "Configure DEPLOY_WEBHOOK_URL / DEPLOY_WEBHOOK_URL_WEB on the production environment."
            exit 0
          fi
          echo "Deploying ${{ matrix.app }} at $IMAGE_TAG"
          STATUS=$(curl -sS -o /tmp/deploy-response -w '%{http_code}' -X POST "$HOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"ref\":\"$IMAGE_TAG\",\"app\":\"${{ matrix.app }}\"}")
          echo "Hook responded $STATUS"
          cat /tmp/deploy-response || true
          case "$STATUS" in
            2*) echo "Rollout requested." ;;
            *) echo "::error::Deploy hook failed with HTTP $STATUS"; exit 1 ;;
          esac

  # --------------------------------------------------------------------------
  verify:
    name: Post-deploy checks
    runs-on: ubuntu-latest
    needs: [resolve, deploy]
    environment:
      name: production
      url: ${{ vars.PRODUCTION_WEB_URL }}

    steps:
      - name: Wait for the API health endpoint
        if: vars.PRODUCTION_API_URL != ''
        run: |
          echo "Polling ${{ vars.PRODUCTION_API_URL }}/health"
          for i in $(seq 1 30); do
            if curl -sf "${{ vars.PRODUCTION_API_URL }}/health" -o /tmp/health; then
              cat /tmp/health
              echo
              echo "API is healthy."
              exit 0
            fi
            echo "Attempt $i: not ready yet."
            sleep 10
          done
          echo "::error::API did not become healthy within 5 minutes."
          exit 1

      - name: Check that the web app serves its login page
        if: vars.PRODUCTION_WEB_URL != ''
        run: |
          for i in $(seq 1 30); do
            if curl -sfI "${{ vars.PRODUCTION_WEB_URL }}/login" >/dev/null; then
              echo "Web app is serving."
              exit 0
            fi
            echo "Attempt $i: not ready yet."
            sleep 10
          done
          echo "::error::Web app did not respond within 5 minutes."
          exit 1

      - name: Summary
        run: |
          {
            echo "### Production deploy complete"
            echo
            echo "- Ref: \`${{ needs.resolve.outputs.display }}\` (\`${{ needs.resolve.outputs.sha }}\`)"
            echo "- API: ${{ vars.PRODUCTION_API_URL || 'not configured' }}"
            echo "- Web: ${{ vars.PRODUCTION_WEB_URL || 'not configured' }}"
          } >> "$GITHUB_STEP_SUMMARY"
